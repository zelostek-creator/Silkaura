services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress-secret}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: &wp_config_extra |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SMTP_HOST', 'mailpit');
        define('SMTP_PORT', 1025);
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/silkaura:/var/www/html/wp-content/themes/silkaura
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress-secret}
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Silkaura}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-me-now}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WC_COUNTRY: ${WC_COUNTRY:-US:CA}
      WC_CURRENCY: ${WC_CURRENCY:-USD}
      HOME: /tmp
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/silkaura:/var/www/html/wp-content/themes/silkaura
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts:ro
    profiles: ["tools"]
    entrypoint: ["wp"]

  phpmyadmin:
    image: phpmyadmin:5
    depends_on: [db]
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
